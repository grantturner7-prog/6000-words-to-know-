<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1236">
<title>Genesis 6,000 Words</title>
<meta name="description" content="Genesis 6,000 English Words to Know: learn 20 new words at a time at three levels, with Traditional Chinese meanings you can switch on or off.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
<script>
/* set the theme before first paint so there is no flash */
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('genesis6000.v1') || '{}');
    var th = (s.prefs && s.prefs.theme) || 'auto';
    var dark = th === 'dark' || (th === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) {}
})();
</script>
</head>
<body>
<div class="blobs" aria-hidden="true"><span></span><span></span><span></span></div>
<div id="app"></div>
<noscript><p style="padding:24px;color:#fff">Please turn on JavaScript to use Genesis 6,000 English Words to Know.</p></noscript>
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/dnd.js"></script>
<script src="js/views-shell.js"></script>
<script src="js/views-batch.js"></script>
<script src="js/main.js"></script>
</body>
</html>
