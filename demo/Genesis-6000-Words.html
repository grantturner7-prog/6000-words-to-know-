/* Genesis 6,000 English Words to Know — liquid-glass design.
   Tokens follow the IELTS app (docs/design/glass.css there): translucent fill, diagonal sheen,
   22px blur with saturation, light edge, inner highlight, soft shadow. Light and dark themes. */
:root{
  --lv1:#2ee6c5;--lv2:#ffb454;--lv3:#b9a2ff;--ok:#41e08a;--warn:#ffb454;--bad:#ff6b81;--blue:#4da3ff;
  --tint:255,255,255;--ink:#fff;--ink2:rgba(255,255,255,.76);--ink3:rgba(255,255,255,.64);--hl:rgba(255,255,255,.55);
  --glass:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.06));--edge:rgba(255,255,255,.32);--shadow:rgba(3,6,28,.38);
  --bg:#0c1236;--sheen:rgba(255,255,255,.3);--bar:rgba(255,255,255,.18);--float:rgba(12,18,54,.74);
  --bg-img:radial-gradient(55% 60% at 88% 4%,rgba(124,92,255,.8),transparent 70%),radial-gradient(45% 55% at 2% 42%,rgba(46,230,197,.5),transparent 70%),radial-gradient(50% 55% at 98% 96%,rgba(255,150,90,.5),transparent 70%),radial-gradient(40% 45% at 10% 100%,rgba(77,163,255,.45),transparent 70%),linear-gradient(160deg,#0c1236,#101a47 55%,#0a1030);
  --blob1:rgba(124,92,255,.55);--blob2:rgba(46,230,197,.42);--blob3:rgba(255,150,90,.42);
  --on-accent:#0b1236;
  --lv:var(--lv1);--lv-grad:linear-gradient(180deg,#d6fff7,#2ee6c5);--lv-rgb:46,230,197;
  color-scheme:dark;
}
:root[data-theme=light]{
  --lv1:#0a9c82;--lv2:#b45f00;--lv3:#6a4ed6;--ok:#13894a;--warn:#b45f00;--bad:#d12a4b;--blue:#1b6fd1;
  --tint:18,26,63;--ink:#121a3f;--ink2:rgba(18,26,63,.78);--ink3:rgba(18,26,63,.68);--hl:rgba(255,255,255,.95);
  --glass:linear-gradient(135deg,rgba(255,255,255,.88),rgba(255,255,255,.55));--edge:rgba(255,255,255,.95);--shadow:rgba(52,62,130,.2);
  --bg:#eef1ff;--sheen:rgba(255,255,255,.7);--bar:rgba(18,26,63,.12);--float:rgba(255,255,255,.62);
  --bg-img:radial-gradient(55% 60% at 88% 4%,rgba(160,140,255,.5),transparent 70%),radial-gradient(45% 55% at 2% 42%,rgba(110,235,215,.45),transparent 70%),radial-gradient(50% 55% at 98% 96%,rgba(255,190,150,.45),transparent 70%),radial-gradient(40% 45% at 10% 100%,rgba(130,185,255,.4),transparent 70%),linear-gradient(160deg,#f4f6ff,#e9eeff 55%,#f6f0ff);
  --blob1:rgba(160,140,255,.5);--blob2:rgba(110,235,215,.5);--blob3:rgba(255,190,150,.5);--lv-rgb:10,156,130;
  color-scheme:light;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme=dark]){
    --lv1:#0a9c82;--lv2:#b45f00;--lv3:#6a4ed6;--ok:#13894a;--warn:#b45f00;--bad:#d12a4b;--blue:#1b6fd1;
    --tint:18,26,63;--ink:#121a3f;--ink2:rgba(18,26,63,.78);--ink3:rgba(18,26,63,.68);--hl:rgba(255,255,255,.95);
    --glass:linear-gradient(135deg,rgba(255,255,255,.88),rgba(255,255,255,.55));--edge:rgba(255,255,255,.95);--shadow:rgba(52,62,130,.2);
    --bg:#eef1ff;--sheen:rgba(255,255,255,.7);--bar:rgba(18,26,63,.12);--float:rgba(255,255,255,.62);
    --bg-img:radial-gradient(55% 60% at 88% 4%,rgba(160,140,255,.5),transparent 70%),radial-gradient(45% 55% at 2% 42%,rgba(110,235,215,.45),transparent 70%),radial-gradient(50% 55% at 98% 96%,rgba(255,190,150,.45),transparent 70%),radial-gradient(40% 45% at 10% 100%,rgba(130,185,255,.4),transparent 70%),linear-gradient(160deg,#f4f6ff,#e9eeff 55%,#f6f0ff);
    --blob1:rgba(160,140,255,.5);--blob2:rgba(110,235,215,.5);--blob3:rgba(255,190,150,.5);--lv-rgb:10,156,130;
    color-scheme:light;
  }
  :root:not([data-theme=dark]) [data-level=beginner]{--lv-rgb:10,156,130}
  :root:not([data-theme=dark]) [data-level=intermediate]{--lv-rgb:180,95,0}
  :root:not([data-theme=dark]) [data-level=advanced]{--lv-rgb:106,78,214}
}
/* the active level sets one accent for the whole screen */
[data-level=beginner]{--lv:var(--lv1);--lv-grad:linear-gradient(180deg,#d6fff7,#2ee6c5);--lv-rgb:46,230,197}
[data-level=intermediate]{--lv:var(--lv2);--lv-grad:linear-gradient(180deg,#fff0d6,#ffb454);--lv-rgb:255,180,84}
[data-level=advanced]{--lv:var(--lv3);--lv-grad:linear-gradient(180deg,#efe9ff,#b9a2ff);--lv-rgb:185,162,255}
:root[data-theme=light] [data-level=beginner]{--lv-rgb:10,156,130}
:root[data-theme=light] [data-level=intermediate]{--lv-rgb:180,95,0}
:root[data-theme=light] [data-level=advanced]{--lv-rgb:106,78,214}

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);min-height:100%;-webkit-text-size-adjust:100%}
body{min-height:100vh;background:var(--bg);font-size:16px;font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg-img)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
h1{font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
h2{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
h3{font-size:19px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:15px;line-height:1.5}.label{font-size:12px;color:var(--ink3);letter-spacing:.05em;text-transform:uppercase}
:focus-visible{outline:3px solid var(--lv);outline-offset:2px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{position:relative;z-index:1}
/* liquid blobs behind everything */
.blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blobs span{position:absolute;border-radius:50%;filter:blur(70px);opacity:.9;animation:drift 26s ease-in-out infinite alternate}
.blobs span:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-10vmax;background:var(--blob2)}
.blobs span:nth-child(2){width:40vmax;height:40vmax;right:-10vmax;top:18vh;background:var(--blob1);animation-duration:32s;animation-delay:-8s}
.blobs span:nth-child(3){width:36vmax;height:36vmax;left:30vw;bottom:-16vmax;background:var(--blob3);animation-duration:38s;animation-delay:-16s}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(5vmax,-4vmax,0) scale(1.12)}100%{transform:translate3d(-4vmax,5vmax,0) scale(.94)}}
:root[data-motion=off] .blobs span,:root[data-motion=off] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.blobs span,*{animation:none!important;transition:none!important}}

/* glass */
.glass{position:relative;background:var(--glass);border:1px solid var(--edge);border-radius:26px;
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 1.5px 0 var(--hl),inset 0 -1px 0 rgba(var(--tint),.1),0 14px 34px var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 70% at 20% -10%,var(--sheen),transparent 55%)}
.glass>*{position:relative}
.card{padding:20px}
.tint{background:linear-gradient(135deg,rgba(var(--lv-rgb),.42),rgba(var(--lv-rgb),.08))}
.lift{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.lift:hover{transform:translateY(-3px);box-shadow:inset 0 1.5px 0 var(--hl),0 20px 44px var(--shadow)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:26px;font-weight:700;font-size:16px;white-space:nowrap;color:var(--on-accent);
  border:1px solid rgba(var(--tint),.5);background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.5));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),0 10px 24px var(--shadow);transition:transform .15s,box-shadow .2s,opacity .2s}
:root[data-theme=light] .btn{background:linear-gradient(180deg,#fff,rgba(255,255,255,.7))}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(1px) scale(.99)}
.btn.primary{background:var(--lv-grad);border-color:rgba(255,255,255,.7);color:#0b1236}
.btn.ghost{color:var(--ink);background:linear-gradient(180deg,rgba(var(--tint),.22),rgba(var(--tint),.08));border-color:rgba(var(--tint),.32);box-shadow:inset 0 1px 0 rgba(var(--tint),.4)}
.btn.sm{min-height:38px;padding:0 16px;font-size:14px}.btn.block{display:flex;width:100%}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;transform:none}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;background:rgba(var(--tint),.14);border:1px solid rgba(var(--tint),.3);box-shadow:inset 0 1px 0 rgba(var(--tint),.4);transition:transform .15s,background .2s}
.iconbtn:hover{background:rgba(var(--tint),.24);transform:scale(1.06)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;white-space:nowrap;background:rgba(var(--tint),.14);border:1px solid rgba(var(--tint),.28)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:var(--lv)}

/* layout */
.row{display:flex;gap:12px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px}.stack.tight{gap:10px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.shell{display:flex;gap:20px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh;max-width:1480px;margin:0 auto}
.side{width:258px;flex:none;position:sticky;top:20px;align-self:flex-start;height:calc(100vh - 40px);border-radius:30px;padding:20px 14px;display:flex;flex-direction:column;gap:6px;z-index:5;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 16px}
.mk{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.04em;background:linear-gradient(135deg,#2ee6c5,#ffb454);color:#0b1236;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),0 6px 16px rgba(46,230,197,.35)}
.brand b{font-size:15px;line-height:1.15;display:block}.brand small{font-size:12px;color:var(--ink2);font-weight:600}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;font-size:15px;font-weight:700;color:var(--ink3);border:1px solid transparent;transition:background .2s,color .2s}
.nav:hover{color:var(--ink);background:rgba(var(--tint),.1)}
.nav svg,.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav.on{color:var(--ink);background:linear-gradient(180deg,rgba(var(--tint),.28),rgba(var(--tint),.08));border-color:rgba(var(--tint),.4);box-shadow:inset 0 1px 0 var(--hl)}
.who{margin-top:auto;padding:14px;border-radius:20px;background:rgba(var(--tint),.1);font-size:14px;display:flex;flex-direction:column;gap:10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px;padding-bottom:28px}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.tabbar{display:none}.mobhdr{display:none}
@media (max-width:900px){
  .shell{padding-top:14px;padding-bottom:104px}.side{display:none}
  .tabbar{display:flex;position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:70px;border-radius:35px;justify-content:space-around;align-items:center;z-index:20;padding:0 6px;background-color:var(--float)}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--ink3);flex:1;min-height:56px;justify-content:center}
  .tab.on{color:var(--ink)}.tab.on svg{filter:drop-shadow(0 0 8px rgba(var(--lv-rgb,255,255,255),.8))}
  .g2,.g3{grid-template-columns:1fr}h1{font-size:28px}
  .mobhdr{display:flex;justify-content:space-between;align-items:center;gap:10px}
}

/* segmented control and switch */
.seg{display:flex;padding:4px;border-radius:24px;gap:4px}
.seg button{flex:1;text-align:center;padding:10px 8px;border-radius:20px;font-size:14px;font-weight:700;color:var(--ink2);min-height:44px;transition:background .2s,color .2s}
.seg button.on{color:#0b1236;background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.55));box-shadow:inset 0 1px 0 #fff,0 4px 12px rgba(0,0,0,.12)}
.seg.levels button.on[data-level=beginner]{background:linear-gradient(180deg,#d6fff7,#2ee6c5)}
.seg.levels button.on[data-level=intermediate]{background:linear-gradient(180deg,#fff0d6,#ffb454)}
.seg.levels button.on[data-level=advanced]{background:linear-gradient(180deg,#efe9ff,#b9a2ff)}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:14px;min-height:44px}
.switch .track{width:52px;height:30px;border-radius:15px;background:rgba(var(--tint),.2);border:1px solid rgba(var(--tint),.32);position:relative;transition:background .25s;flex:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.2)}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,#fff,#dfe6ff);box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.switch[aria-checked=true] .track{background:linear-gradient(180deg,rgba(var(--lv-rgb),.9),rgba(var(--lv-rgb),.6))}
.switch[aria-checked=true] .track::after{transform:translateX(22px)}

/* welcome */
.welcome{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
.hero{max-width:640px;width:100%;padding:44px 36px;text-align:center;display:flex;flex-direction:column;gap:22px;align-items:center}
.hero .big{font-size:84px;font-weight:800;letter-spacing:-.05em;line-height:.95;background:linear-gradient(135deg,#2ee6c5,#b9a2ff 55%,#ffb454);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(124,92,255,.35))}
:root[data-theme=light] .hero .big{background:linear-gradient(135deg,#0a9c82,#6a4ed6 55%,#d9730d);-webkit-background-clip:text;background-clip:text}
.hero h1{font-size:30px}.hero .by{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink2)}
.hero input{width:100%;max-width:340px;padding:15px 20px;border-radius:26px;background:rgba(var(--tint),.12);border:1px solid rgba(var(--tint),.32);outline:none;text-align:center;font-size:17px;font-weight:600;box-shadow:inset 0 2px 6px rgba(0,0,0,.12)}
.hero input::placeholder{color:var(--ink3)}.hero input:focus{border-color:var(--ink);background:rgba(var(--tint),.18)}
.floaters{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.floaters span{position:absolute;padding:9px 18px;border-radius:999px;font-weight:700;font-size:17px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 var(--hl),0 10px 24px var(--shadow);animation:bob 9s ease-in-out infinite;opacity:.85}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-18px) rotate(2deg)}}
@media (max-width:640px){.hero{padding:32px 22px}.hero .big{font-size:64px}.floaters span{font-size:14px;padding:7px 14px}}

/* stat tiles, rings, bars */
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:2px}.stat b{font-size:30px;font-weight:800;letter-spacing:-.02em}.stat span{font-size:13px;color:var(--ink2);font-weight:600}
.ring{--p:0;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--lv) calc(var(--p)*1%),rgba(var(--tint),.16) 0);position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg);opacity:.9}
.ring b{position:relative;font-size:20px;font-weight:800}
.meter{height:8px;border-radius:4px;background:var(--bar);overflow:hidden}.meter i{display:block;height:100%;border-radius:4px;background:var(--lv-grad);transition:width .5s}
.stars{display:inline-flex;gap:3px;font-size:18px;letter-spacing:1px}.stars .off{opacity:.28;filter:grayscale(1)}

/* batches */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;background:rgba(var(--tint),.12);border:1px solid rgba(var(--tint),.28);min-height:42px;transition:background .2s}
.chipbtn.on{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.55));color:#0b1236;border-color:#fff}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.bcard{padding:14px 12px;border-radius:22px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-height:96px;text-align:left}
.bcard b{font-size:22px;font-weight:800;letter-spacing:-.02em}.bcard small{font-size:12px;color:var(--ink2);font-weight:600}
.bcard.locked{opacity:.55}.bcard.open{background:linear-gradient(135deg,rgba(var(--lv-rgb),.4),rgba(var(--lv-rgb),.1))}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;border:1px solid rgba(var(--tint),.35);letter-spacing:.04em;text-transform:uppercase}

/* station cards */
.station{padding:22px;display:flex;flex-direction:column;gap:14px;text-align:left}
.num{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:800;background:var(--lv-grad);color:#0b1236;flex:none}
.acts{display:flex;flex-direction:column;gap:8px}
.act{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:rgba(var(--tint),.09);font-weight:600;font-size:15px;text-align:left;min-height:52px;width:100%;transition:background .2s}
.sel{padding:10px 14px;border-radius:16px;background:rgba(var(--tint),.12);border:1px solid rgba(var(--tint),.3);color:inherit;font:inherit;font-weight:600;min-width:0;max-width:100%;text-overflow:ellipsis}.sel option{color:CanvasText;background:Canvas}
.act .pill{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis}.grid>*{min-width:0}
.act:hover{background:rgba(var(--tint),.18)}.act .em{font-size:22px;width:30px;text-align:center}.act .go{margin-left:auto;color:var(--ink3)}
.act .ok{color:var(--ok);font-weight:800}
.setdots{display:flex;gap:6px}.setdots i{width:11px;height:11px;border-radius:50%;background:rgba(var(--tint),.25);border:1px solid rgba(var(--tint),.3)}.setdots i.on{background:var(--ok);border-color:var(--ok);box-shadow:0 0 10px var(--ok)}

/* activity frame */
.player{display:flex;flex-direction:column;gap:18px;max-width:880px;width:100%;margin:0 auto}
.pbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crumbs{font-size:14px;color:var(--ink2);font-weight:700}
.prog{display:flex;gap:6px;flex:1;min-width:120px}.prog i{flex:1;height:8px;border-radius:4px;background:var(--bar)}.prog i.on{background:var(--lv-grad)}.prog i.now{background:rgba(var(--lv-rgb),.55)}
.stage{padding:28px;display:flex;flex-direction:column;gap:22px;align-items:center;text-align:center;min-height:300px;justify-content:center}
@media (max-width:640px){.stage{padding:20px 16px}}

/* word card */
.wcard{width:100%;max-width:560px;margin:0 auto;padding:30px 26px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.wcard .emoji{font-size:64px;line-height:1;filter:drop-shadow(0 8px 14px rgba(0,0,0,.25))}
.wcard .word{font-size:46px;font-weight:800;letter-spacing:-.025em}
.wcard .pos{font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.wcard .def{font-size:20px;font-weight:600;line-height:1.4}
.wcard .zh{font-size:26px;font-weight:700;color:var(--lv)}
.wcard .ex{font-size:19px;line-height:1.55;color:var(--ink);padding:14px 18px;border-radius:20px;background:rgba(var(--tint),.1);width:100%}
.hl,.wp{border-radius:8px;cursor:pointer}
.hl{font-weight:800;padding:1px 6px;background:rgba(var(--lv-rgb),.3);box-shadow:0 0 0 1px rgba(var(--lv-rgb),.7)}
.hl:hover{background:rgba(var(--lv-rgb),.5)}

/* chips (draggable words), gaps, slots */
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 18px;border-radius:999px;font-weight:800;font-size:18px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.14));border:1px solid rgba(var(--tint),.45);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 8px 18px var(--shadow);transition:transform .15s,box-shadow .2s,opacity .2s,background .2s}
:root[data-theme=light] .chip{background:linear-gradient(180deg,#fff,rgba(255,255,255,.65))}
.chip:hover{transform:translateY(-2px)}.chip small{font-size:12px;font-weight:700;opacity:.85}
.chip.sel{outline:3px solid var(--lv);outline-offset:3px;transform:translateY(-3px) scale(1.04)}
.chip.dragging{opacity:.3}.chip.ghost{position:fixed;z-index:1000;pointer-events:none;cursor:grabbing;transform:scale(1.12) rotate(-3deg);box-shadow:0 22px 44px rgba(0,0,0,.4);opacity:1}
.chip.ok{background:linear-gradient(180deg,rgba(65,224,138,.75),rgba(65,224,138,.35));border-color:var(--ok);cursor:default}
.chip.zhline{flex-direction:column;gap:0;padding:6px 18px;line-height:1.2}
.chip.shake,.slot.shake,.opt.shake,.gap.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.bank{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:16px;border-radius:24px;background:rgba(var(--tint),.08);border:1px dashed rgba(var(--tint),.3);min-height:76px;width:100%}
.story{font-size:20px;line-height:2.5;font-weight:500;text-align:left;width:100%}
@media (max-width:640px){.story{font-size:18px;line-height:2.4}}
.gap{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-width:104px;min-height:44px;margin:0 3px;padding:0 6px;border-radius:16px;background:rgba(var(--tint),.1);border:2px dashed rgba(var(--tint),.45);font-weight:800;color:var(--ink3);font-size:15px;transition:background .2s,border-color .2s;cursor:pointer}
.gap .n{font-size:13px;opacity:.8}
.gap.filled .n{display:none}
.gap.over,.dz.over{background:rgba(var(--lv-rgb),.3);border-color:var(--lv);transform:scale(1.04)}
.gap.filled{border-style:solid;background:rgba(var(--tint),.05);padding:0}.gap.filled .chip{min-height:40px;font-size:17px;box-shadow:none;cursor:grab}
.gap.right{border-color:var(--ok);background:rgba(65,224,138,.18)}.gap.wrong{border-color:var(--warn);background:rgba(255,180,84,.2)}
.gap.reveal{border-color:var(--blue);background:rgba(77,163,255,.2)}
.dz.waiting{outline:2px dashed var(--lv);outline-offset:3px}

/* match it */
.match{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%;align-items:start}
.match .col{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.mean{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px;border-radius:20px;background:rgba(var(--tint),.1);border:2px dashed rgba(var(--tint),.4);text-align:left;font-weight:600;font-size:16px;transition:background .2s,border-color .2s}
.mean .zh{font-weight:700;color:var(--lv);font-size:15px;display:block}
.mean.done{border-style:solid;border-color:var(--ok);background:rgba(65,224,138,.14)}
.mean .slotfill{margin-left:auto}
@media (max-width:640px){.match{grid-template-columns:1fr;gap:14px}.match .col:first-child{flex-direction:row;flex-wrap:wrap;justify-content:center}.match .col:first-child .chip{min-height:42px;padding:6px 14px;font-size:16px}.mean{min-height:56px;font-size:15px}}

/* build it / letters */
.slots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.slot{width:54px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:28px;font-weight:800;background:rgba(var(--tint),.1);border:2px dashed rgba(var(--tint),.45);transition:background .2s,border-color .2s;cursor:pointer}
.slot.right{border-color:var(--ok);background:rgba(65,224,138,.2);border-style:solid}.slot.wrong{border-color:var(--warn);background:rgba(255,180,84,.2);border-style:solid}
.slot .chip{min-height:0;height:100%;width:100%;padding:0;border-radius:16px;font-size:28px;box-shadow:none}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{width:54px;height:60px;border-radius:18px;font-size:27px;padding:0}
.tile.used{opacity:.25;pointer-events:none}
.hintbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.bighint{font-size:30px;font-weight:800;letter-spacing:-.01em}.bighint .e{font-size:48px;display:block;margin-bottom:6px}

/* pick the word + options */
.sentence{font-size:26px;font-weight:700;line-height:1.7;max-width:700px}
@media (max-width:640px){.sentence{font-size:22px}}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:560px}
.opt{min-height:60px;padding:10px 18px;border-radius:22px;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(180deg,rgba(var(--tint),.24),rgba(var(--tint),.08));border:1px solid rgba(var(--tint),.38);box-shadow:inset 0 1.5px 0 var(--hl),0 8px 18px var(--shadow);transition:transform .15s,background .2s}
.opt:hover{transform:translateY(-2px)}.opt.right{background:rgba(65,224,138,.4);border-color:var(--ok)}.opt.wrong{background:rgba(255,180,84,.3);border-color:var(--warn)}
@media (max-width:480px){.opts{grid-template-columns:1fr}}

/* sentence maker */
.maker{display:flex;flex-direction:column;gap:14px;width:100%;max-width:720px}
.maker .row3{display:flex;flex-direction:column;gap:8px;text-align:left}
.maker .rlabel{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.maker .rtiles{display:flex;gap:8px;flex-wrap:wrap}
.mt{padding:10px 16px;border-radius:18px;font-weight:700;font-size:16px;min-height:46px;background:rgba(var(--tint),.12);border:1px solid rgba(var(--tint),.32);transition:background .2s,transform .15s}
.mt:hover{transform:translateY(-1px);background:rgba(var(--tint),.2)}
.mt.on{background:var(--lv-grad);color:#0b1236;border-color:#fff;box-shadow:0 6px 16px rgba(var(--lv-rgb),.4)}
.mt.tgt{border-color:rgba(var(--lv-rgb),.9)}
.preview{min-height:84px;padding:18px 22px;border-radius:24px;font-size:24px;font-weight:700;line-height:1.5;display:flex;align-items:center;justify-content:center;text-align:center;width:100%;background:rgba(var(--tint),.1);border:1px dashed rgba(var(--tint),.35)}
.preview.done{border-style:solid;border-color:var(--ok);background:rgba(65,224,138,.14)}
.preview .ph{color:var(--ink3);font-weight:600;font-size:17px}

/* finish banner, toast, popover, sheet */
.banner{padding:22px 26px;border-radius:26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;text-align:center;background:linear-gradient(135deg,rgba(65,224,138,.35),rgba(65,224,138,.08))}
.banner .big{font-size:42px}.banner b{font-size:22px}
.toasts{position:fixed;left:0;right:0;padding-inline:max(16px,env(safe-area-inset-left,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:900;pointer-events:none}
@media (min-width:901px){.toasts{bottom:28px}}
.toast{padding:12px 22px;border-radius:999px;font-weight:700;font-size:15px;background-color:var(--float);animation:rise .3s both;pointer-events:auto}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.peek{position:fixed;z-index:950;width:min(340px,calc(100vw - 24px));padding:20px;border-radius:26px;background-color:var(--float);animation:pop .22s cubic-bezier(.2,1.2,.4,1) both}
.peek[hidden]{display:none}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(6px)}to{opacity:1;transform:none}}
.peek .pw{font-size:30px;font-weight:800;letter-spacing:-.02em}.peek .pd{font-size:16px;line-height:1.45;margin-top:6px}.peek .pz{font-size:22px;font-weight:700;color:var(--lv);margin-top:8px}
.peek .px{position:absolute;top:10px;right:10px}
@media (max-width:640px){.peek{left:max(12px,env(safe-area-inset-left,0px))!important;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(90px + env(safe-area-inset-bottom,0px));top:auto!important;width:auto}}
dialog.sheet{width:min(440px,calc(100vw - 28px));padding:24px;margin:auto;border:1px solid var(--edge);border-radius:28px;color:var(--ink);background-color:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.5)}
dialog.sheet::backdrop{background:rgba(6,10,40,.55);backdrop-filter:blur(6px)}
dialog.sheet h3{margin-bottom:14px}.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid rgba(var(--tint),.14);flex-wrap:wrap}.setrow:first-of-type{border-top:0}
.setrow>span{font-weight:700;font-size:15px}.setrow .seg{min-width:200px}
.empty{padding:26px;text-align:center;color:var(--ink2)}
.saved{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:rgba(var(--tint),.09);font-weight:600;font-size:16px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:990;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.hint-text{font-size:14px;color:var(--ink2);font-weight:600}

        '<button class="btn primary" data-act="cardNext">' + esc(card === ws.length - 1 ? t('meet.toMatch') : t('common.next')) + G.icon('arrow') + '</button></div>';
    }
    G.acts.cardNext = () => { if (card < ws.length - 1) { card++; cards(); G.say(ws[card].headword); } else { step = 1; match(); } };
    G.acts.cardPrev = () => { if (card > 0) { card--; cards(); G.say(ws[card].headword); } };

    function match() {
      setProg(1, 3);
      const left = G.shuffle(ws), right = G.shuffle(ws);
      stage.innerHTML = '<h3>' + esc(t('match.title')) + '</h3><div class="match"><div class="col">' +
        left.map(w => '<button class="chip" data-w="' + w.id + '">' + (w.emoji || '') + ' ' + esc(w.headword) + '</button>').join('') + '</div><div class="col">' +
        right.map(w => '<div class="mean dz" data-w="' + w.id + '" role="button" tabindex="0" aria-label="' + esc(w.defEN) + '"><span>' + esc(w.defEN) + (G.zhOn() ? '<span class="zh">' + esc(w.zhTW) + '</span>' : '') + '</span><span class="slotfill"></span></div>').join('') + '</div></div>' +
        '<div class="hint-text" id="fb" style="min-height:22px"></div>';
      let matched = 0;
      const d = G.dnd.attach(stage, {
        chip: '.chip', zone: '.mean',
        onDrop: (chip, zone) => {
          const fb = G.$('#fb', stage);
          if (chip.dataset.w === zone.dataset.w) {
            zone.classList.add('done', 'locked'); G.$('.slotfill', zone).appendChild(chip); chip.classList.add('ok'); matched++;
            fb.textContent = t('fb.great');
            if (matched === ws.length) { fb.textContent = t('match.great'); setTimeout(() => { step = 2; build(); }, 900); }
          } else {
            zone.classList.add('shake'); chip.classList.add('shake'); fb.textContent = t('match.tryAnother');
            setTimeout(() => { zone.classList.remove('shake'); chip.classList.remove('shake'); }, 480);
          }
        }
      });
      cleanupDnd = d.clearSel;
    }

    function build() {
      setProg(2, 3);
      buildRound(stage, ws, {
        mode: 'build',
        onDone: () => {
          const p = G.pg(b.id, lv); p.meet[set - 1] = 1; G.save();
          const next = set < 4 ? { label: t('set.n', { n: set + 1 }), href: '#/batch/' + b.id + '/meet/' + (set + 1), primary: true } : { label: t('station.use'), href: '#/batch/' + b.id + '/use/pick/1', primary: true };
          finishCard(stage, { emoji: '🌟', title: t('set.complete', { n: set }), actions: [next, { label: t('story.finish'), href: '#/batch/' + b.id }] });
        }
      });
    }
    G.redraw = () => { if (step === 0) cards(); else if (step === 1) match(); };
    cards(); G.say(ws[0].headword);
  }

  /* ---------- BUILD IT and MISSING LETTERS (letter tiles) ---------- */
  function buildRound(stage, words, o) {
    const lv = G.level(), mode = o.mode || 'build';
    let i = 0, firstTry = 0, wrongThisWord = false, hint = lv !== 'advanced', locked = false;
    const decoys = mode === 'build' ? levelSupport() : 3;
    G.redraw = () => draw(true);

    function draw(keep) {
      const w = words[i], word = w.headword.toLowerCase(), letters = word.split('');
      if (!keep || !draw.cur || draw.cur.id !== w.id) {
        let blanks = letters.map((_, k) => k);
        if (mode === 'missing') {
          const nb = Math.min(letters.length - 1, { beginner: 1, intermediate: 2, advanced: 3 }[lv] + (letters.length > 6 ? 1 : 0));
          blanks = G.sample(letters.map((_, k) => k), Math.max(1, nb)).sort((a, b) => a - b);
        }
        const need = blanks.map(k => letters[k]);
        const abc = 'abcdefghijklmnopqrstuvwxyz'.split('').filter(c => letters.indexOf(c) < 0);
        const pool = need.concat(G.sample(abc, decoys));
        draw.cur = { id: w.id, blanks, letters, tiles: G.shuffle(pool.map((ch, n) => ({ ch, n }))) };
        wrongThisWord = false; locked = false;
      }
      const cur = draw.cur;
      setProg(i, words.length);
      const hintBlock = hint
        ? '<div class="bighint"><span class="e">' + (w.emoji || '') + '</span>' + (G.zhOn() ? esc(w.zhTW) : esc(w.defEN)) + '</div>'
        : '<div class="bighint"><span class="e">' + (w.emoji || '') + '</span><button class="btn sm ghost" data-act="bHint">' + G.icon('bulb') + esc(t('common.hint')) + '</button></div>';
      stage.innerHTML = '<div class="hint-text">' + esc(t(mode === 'build' ? 'build.title' : 'missing.title')) + ' · ' + (i + 1) + ' / ' + words.length + '</div>' + hintBlock +
        '<div class="row"><button class="btn ghost" data-act="say" data-say="' + esc(w.headword) + '">' + G.icon('speaker') + esc(t('common.listen')) + '</button></div>' +
        '<div class="slots" id="slots">' + cur.letters.map((ch, k) => cur.blanks.indexOf(k) >= 0
          ? '<div class="slot dz" data-k="' + k + '" role="button" tabindex="0" aria-label="letter ' + (k + 1) + '"></div>'
          : '<div class="slot right" style="border-style:solid">' + esc(ch) + '</div>').join('') + '</div>' +
        '<div class="tiles" id="tiles">' + cur.tiles.map(x => '<button class="chip tile" data-n="' + x.n + '" data-ch="' + x.ch + '">' + x.ch + '</button>').join('') + '</div>' +
        '<div class="hint-text" id="fb" style="min-height:22px"></div><div class="row" id="nx"></div>';
      const tray = G.$('#tiles', stage);
      G.dnd.attach(stage, {
        chip: '.tile', zone: '.slot.dz',
        tapPlace: chip => chip.parentElement === tray ? G.$$('.slot.dz', stage).find(s => !s.querySelector('.chip') && !s.classList.contains('locked')) || null : null,
        onTap: chip => { if (chip.parentElement.classList.contains('slot')) { tray.appendChild(chip); refreshSlots(); return true; } return false; },
        canDrag: () => !locked,
        onDrop: (chip, zone) => {
          const old = zone.querySelector('.chip'); if (old && old !== chip) tray.appendChild(old);
          zone.classList.remove('wrong'); zone.appendChild(chip); refreshSlots(); evaluate();
        }
      });
    }
    function refreshSlots() { G.$$('.slot.dz', stage).forEach(s => { if (!s.querySelector('.chip')) s.classList.remove('wrong'); }); }
    G.acts.bHint = () => { hint = true; draw(true); };

    function evaluate() {
      const cur = draw.cur, slots = G.$$('.slot.dz', stage);
      if (slots.some(s => !s.querySelector('.chip'))) return;
      const ok = slots.every(s => s.querySelector('.chip').dataset.ch === cur.letters[+s.dataset.k]);
      const fb = G.$('#fb', stage);
      if (ok) {
        locked = true;
        slots.forEach(s => { s.classList.add('right', 'locked'); s.querySelector('.chip').classList.add('ok'); });
        fb.textContent = t('build.great'); if (!wrongThisWord) firstTry++;
        G.say(words[i].headword);
        const last = i === words.length - 1;
        G.$('#nx', stage).innerHTML = '<button class="btn primary" data-act="bNext">' + esc(last ? t('common.done') : t('build.next')) + G.icon('arrow') + '</button>';
      } else {
        wrongThisWord = true; fb.textContent = t('build.almost');
        slots.forEach(s => { if (s.querySelector('.chip').dataset.ch !== cur.letters[+s.dataset.k]) { s.classList.add('wrong', 'shake'); } });
        setTimeout(() => {
          const tray = G.$('#tiles', stage); if (!tray) return;
          G.$$('.slot.wrong', stage).forEach(s => { const c = s.querySelector('.chip'); if (c) tray.appendChild(c); s.classList.remove('wrong', 'shake'); });
        }, 800);
      }
    }
    G.acts.bNext = () => {
      if (i < words.length - 1) { i++; draw(false); G.say(words[i].headword); } else o.onDone(firstTry, words.length);
    };
    draw(false); G.say(words[0].headword);
  }

  /* ---------- USE: pick, maker, bee ---------- */
  G.route(/^#\/batch\/(b\d+)\/use\/(pick|maker|bee)\/([12])$/, function (id, act, part) {
    part = +part;
    return G.loadBatch(id).then(b => {
      const pg = playerPage(esc(t('station.use')) + ' · ' + esc(t('act.' + act)) + ' · ' + esc(t('common.part', { n: part })), '#/batch/' + id, '#/batch/' + id);
      pg.mount = root => {
        const stage = G.$('#stage', root), ws = partWords(b, part), lv = G.level();
        const done = (score, total) => {
          const p = G.pg(id, lv);
          if (act === 'pick') p.pick[part - 1] = score; else if (act === 'maker') p.maker[part - 1] = Math.max(1, score); else p.bee[part - 1] = score;
          G.save();
          const nextHref = part === 1 ? '#/batch/' + id + '/use/' + act + '/2' : (act === 'pick' ? '#/batch/' + id + '/use/maker/1' : act === 'maker' ? '#/batch/' + id + '/use/bee/1' : '#/batch/' + id + '/story/1');
          finishCard(stage, {
            emoji: '🎯', title: act === 'maker' ? t('maker.saved') : t('pick.score', { n: score, m: total }),
            actions: [{ label: part === 1 ? t('common.part', { n: 2 }) : (act === 'bee' ? t('station.story') : t('common.next')), href: nextHref, primary: true }, { label: t('common.again'), act: 'replay' }, { label: t('story.finish'), href: '#/batch/' + id }]
          });
          G.acts.replay = () => { location.hash = '#/batch/' + id + '/use/' + act + '/' + part; G.render(); };
        };
        if (act === 'pick') pickRound(stage, b, ws, done);
        else if (act === 'maker') makerRound(stage, ws, done);
        else beeRound(stage, ws, done);
      };
      return pg;
    });
  });

  function pickRound(stage, b, words, onDone) {
    const lv = G.level(), order = G.shuffle(words);
    let i = 0, score = 0, tries = 0;
    function draw() {
      const w = order[i], ex = w.examples[lv];
      const m = ex.match(/^(.*)\{([^{}]+)\}(.*)$/), form = m[2];
      const opts = G.shuffle([w.headword].concat(w.pick[lv]));
      setProg(i, order.length); tries = 0;
      stage.innerHTML = '<div class="hint-text">' + esc(t('pick.title')) + ' · ' + (i + 1) + ' / ' + order.length + '</div>' +
        '<div class="sentence">' + esc(m[1]) + '<span class="gap dz" id="gap" role="button" tabindex="0" aria-label="gap">?</span>' + esc(m[3]) + '</div>' +
        '<div class="bank">' + opts.map(h => { const ow = byHead(b, h); return '<button class="chip' + (G.zhOn() ? ' zhline' : '') + '" data-h="' + esc(h) + '">' + esc(h) + (G.zhOn() ? '<small>' + esc(ow.zhTW) + '</small>' : '') + '</button>'; }).join('') + '</div>' +
        '<div class="hint-text" id="fb" style="min-height:22px"></div><div class="row" id="nx"></div>';
      const gap = G.$('#gap', stage);
      G.dnd.attach(stage, {
        chip: '.chip', zone: '.gap',
        tapPlace: () => gap.classList.contains('locked') ? null : gap,
        onDrop: chip => {
          const fb = G.$('#fb', stage);
          if (chip.dataset.h === w.headword) {
            gap.classList.add('filled', 'right', 'locked'); gap.textContent = form;
            fb.textContent = t('pick.great'); if (tries === 0) score++;
            G.$$('.chip', stage).forEach(c => c.classList.add('used'));
            G.say(G.exPlain(ex));
            finish();
          } else {
            tries++; chip.classList.add('shake'); setTimeout(() => chip.classList.remove('shake'), 480);
            fb.textContent = t('bee.tryAnother');
            if (tries >= 2) {
              gap.classList.add('filled', 'reveal', 'locked'); gap.textContent = form; fb.textContent = t('pick.reveal');
              G.$$('.chip', stage).forEach(c => c.classList.add('used')); finish();
            }
          }
        }
      });
    }
    function finish() {
      G.$('#nx', stage).innerHTML = '<button class="btn primary" data-act="pNext">' + esc(i === order.length - 1 ? t('common.done') : t('common.next')) + G.icon('arrow') + '</button>';
    }
    G.acts.pNext = () => { if (i < order.length - 1) { i++; draw(); } else onDone(score, order.length); };
    G.redraw = draw; draw();
  }

  const ASSEMBLE = tiles => {
    let s = tiles.join(' ').trim().replace(/\s+([,.!?])/g, '$1');
    if (s && s[0] === s[0].toLowerCase()) s = s[0].toUpperCase() + s.slice(1);
    if (s && !/[.!?]$/.test(s)) s += '.';
    return s;
  };
  function makerRound(stage, words, onDone) {
    const lv = G.level();
    let i = 0, picks = [], saved = false;
    function draw() {
      const w = words[i], rows = w.frames[lv].rows;
      picks = rows.map(() => -1); saved = false; setProg(i, words.length);
      stage.innerHTML = '<div class="hint-text">' + esc(t('maker.title')) + ' · ' + (i + 1) + ' / ' + words.length + '</div>' +
        '<div class="row"><span class="chip" style="cursor:default;touch-action:auto" data-peek="' + w.id + '">' + (w.emoji || '') + ' ' + esc(w.headword) + '</span><span class="hint-text">' + esc(t('maker.sub')) + '</span></div>' +
        '<div class="preview" id="pv"><span class="ph">' + esc(t('maker.placeholder')) + '</span></div>' +
        '<div class="maker">' + rows.map((r, ri) => '<div class="row3"><div class="rlabel">' + esc(t('maker.' + r.label)) + '</div><div class="rtiles">' +
          r.tiles.map((tile, ti) => '<button class="mt' + (r.target ? ' tgt' : '') + '" data-r="' + ri + '" data-t="' + ti + '" aria-pressed="false">' + esc(tile) + '</button>').join('') + '</div></div>').join('') + '</div>' +
        '<div class="row wrap" id="nx" style="justify-content:center"></div>';
      G.$$('.mt', stage).forEach(btn => btn.addEventListener('click', () => {
        const ri = +btn.dataset.r, ti = +btn.dataset.t; picks[ri] = ti;
        G.$$('.mt[data-r="' + ri + '"]', stage).forEach(x => { const on = +x.dataset.t === ti; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
        const chosen = picks.map((p, k) => p >= 0 ? rows[k].tiles[p] : null);
        const pv = G.$('#pv', stage);
        if (chosen.every(Boolean)) {
          const text = ASSEMBLE(chosen); pv.classList.add('done'); pv.textContent = text; draw.text = text;
          G.$('#nx', stage).innerHTML = '<button class="btn ghost" data-act="say" data-say="' + esc(text) + '">' + G.icon('speaker') + esc(t('common.listen')) + '</button>' +
            '<button class="btn ghost" data-act="mSave">' + G.icon('star') + esc(t('maker.save')) + '</button>' +
            '<button class="btn primary" data-act="mNext">' + esc(i === words.length - 1 ? t('common.done') : t('maker.next')) + G.icon('arrow') + '</button>';
        } else {
          pv.classList.remove('done');
          pv.innerHTML = chosen.some(Boolean) ? esc(ASSEMBLE(chosen.map(x => x || '…'))) : '<span class="ph">' + esc(t('maker.placeholder')) + '</span>';
          G.$('#nx', stage).innerHTML = '';
        }
      }));
    }
    G.acts.mSave = () => {
      if (saved) return; saved = true;
      G.state.sentences.push({ w: words[i].headword, level: lv, text: draw.text, at: G.today() }); G.save();
      G.toast(t('maker.saved'));
    };
    G.acts.mNext = () => { if (i < words.length - 1) { i++; draw(); } else onDone(words.length, words.length); };
    G.redraw = null; draw();
  }

  function beeRound(stage, words, onDone) {
    const lv = G.level(), order = G.shuffle(words);
    let i = 0, score = 0, tries = 0, hint = lv !== 'advanced';
    function draw() {
      const w = order[i]; tries = 0; setProg(i, order.length);
      const opts = G.shuffle([w.headword].concat(w.confusable.slice(0, 2)));
      stage.innerHTML = '<div class="hint-text">' + esc(t('bee.title')) + ' · ' + (i + 1) + ' / ' + order.length + '</div>' +
        '<div class="bighint"><span class="e">' + (w.emoji || '') + '</span>' + (hint ? (G.zhOn() ? esc(w.zhTW) : esc(w.defEN)) : '<button class="btn sm ghost" data-act="beeHint">' + G.icon('bulb') + esc(t('common.hint')) + '</button>') + '</div>' +
        '<button class="btn primary" data-act="say" data-say="' + esc(w.headword) + '">' + G.icon('speaker') + esc(t('common.listen')) + '</button>' +
        '<div class="opts" style="grid-template-columns:repeat(' + opts.length + ',1fr);max-width:640px">' + opts.map(o => '<button class="opt" data-o="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>' +
        '<div class="hint-text" id="fb" style="min-height:22px"></div><div class="row" id="nx"></div>';
      G.$$('.opt', stage).forEach(btn => btn.addEventListener('click', () => {
        if (btn.classList.contains('right')) return;
        const fb = G.$('#fb', stage);
        if (btn.dataset.o === w.headword) {
          btn.classList.add('right'); G.$$('.opt', stage).forEach(x => { x.disabled = true; }); fb.textContent = t('bee.great');
          if (tries === 0) score++; G.say(w.headword);
          G.$('#nx', stage).innerHTML = '<button class="btn primary" data-act="beeNext">' + esc(i === order.length - 1 ? t('common.done') : t('common.next')) + G.icon('arrow') + '</button>';
        } else { tries++; btn.classList.add('wrong', 'shake'); fb.textContent = t('bee.tryAnother'); setTimeout(() => btn.classList.remove('shake'), 480); }
      }));
      G.say(w.headword);
    }
    G.acts.beeHint = () => { hint = true; draw(); };
    G.acts.beeNext = () => { if (i < order.length - 1) { i++; draw(); } else onDone(score, order.length); };
    G.redraw = draw; draw();
  }

  /* ---------- STORY: drag each word into its gap ---------- */
  G.route(/^#\/batch\/(b\d+)\/story\/([12])$/, function (id, part) {
    part = +part;
    return G.loadBatch(id).then(b => {
      const lv = G.level();
      const pg = playerPage(esc(t('station.story')) + ' · ' + esc(t('common.part', { n: part })), '#/batch/' + id, '#/batch/' + id);
      pg.mount = root => storyPart(G.$('#stage', root), b, lv, part);
      return pg;
    });
  });

  function storyPart(stage, b, lv, part) {
    const data = b.stories[lv].parts[part - 1], gaps = data.gaps;
    const wordOf = id => b.words.find(w => w.id === id);
    const tries = gaps.map(() => 0), state = { done: false };
    const pieces = data.text.split(/(\[\[\d+\]\])/);
    let bankOrder = G.shuffle(gaps.map((g, k) => k));

    function draw() {
      setProg(part - 1, 2);
      const body = pieces.map(p => { const m = p.match(/^\[\[(\d+)\]\]$/); return m ? '<span class="gap dz" data-g="' + (m[1] - 1) + '" role="button" tabindex="0" aria-label="' + esc(t('story.gapN', { n: m[1] })) + '"><span class="n">' + m[1] + '</span></span>' : esc(p); }).join('');
      stage.innerHTML = '<div class="row between wrap" style="width:100%"><h3>' + esc(data.title) + '</h3><span class="hint-text">' + esc(t('story.sub')) + '</span></div>' +
        '<div class="story" id="story">' + body + '</div>' +
        '<div class="hint-text">' + esc(t('story.bank')) + '</div>' +
        '<div class="bank" id="bank">' + bankOrder.map(k => chipHtml(k)).join('') + '</div>' +
        '<div class="hint-text" id="fb" style="min-height:22px"></div><div class="row wrap" id="nx" style="justify-content:center"><button class="btn primary" data-act="sCheck">' + G.icon('check') + esc(t('common.check')) + '</button></div>';
      const bank = G.$('#bank', stage);
      const d = G.dnd.attach(stage, {
        chip: '.chip', zone: '.gap',
        onTap: chip => { if (chip.parentElement.classList.contains('gap') && !chip.classList.contains('ok')) { bank.appendChild(chip); sync(); return true; } return false; },
        onDrop: (chip, gap) => {
          if (gap.classList.contains('locked')) return;
          const old = gap.querySelector('.chip'); if (old && old !== chip) bank.appendChild(old);
          gap.classList.remove('wrong'); gap.appendChild(chip); gap.classList.add('filled'); sync();
        }
      });
      chip_dblclick();
    }
    function chipHtml(k) {
      const g = gaps[k], w = wordOf(g.w);
      return '<button class="chip' + (G.zhOn() ? ' zhline' : '') + '" data-k="' + k + '" data-w="' + g.w + '">' + esc(g.form) + (G.zhOn() ? '<small>' + esc(w.zhTW) + '</small>' : '') + '</button>';
    }
    function sync() { G.$$('.gap', stage).forEach(g => { const has = !!g.querySelector('.chip'); g.classList.toggle('filled', has); if (!has) g.classList.remove('wrong'); }); }
    function chip_dblclick() { stage.addEventListener('dblclick', e => { const c = e.target.closest('.chip'); if (c && c.dataset.w) G.peek(c.dataset.w, c); }); }

    G.acts.sCheck = () => {
      const gs = G.$$('.gap', stage), bank = G.$('#bank', stage), fb = G.$('#fb', stage);
      let right = 0, wrongGaps = [];
      gs.forEach(g => {
        const k = +g.dataset.g, chip = g.querySelector('.chip');
        if (g.classList.contains('locked')) { right++; return; }
        if (!chip) return;
        if (+chip.dataset.k === k) { g.classList.add('right', 'locked'); g.classList.remove('wrong'); chip.classList.add('ok'); right++; }
        else { g.classList.add('wrong', 'shake'); tries[k]++; wrongGaps.push(g); }
      });
      if (right === gs.length) return complete();
      fb.textContent = t('story.keepGoing', { n: right });
      setTimeout(() => {
        wrongGaps.forEach(g => { const c = g.querySelector('.chip'); if (c) bank.appendChild(c); g.classList.remove('wrong', 'shake'); g.classList.remove('filled'); });
        let revealed = false;
        gs.forEach(g => {
          const k = +g.dataset.g;
          if (!g.classList.contains('locked') && tries[k] >= 2) {
            const chip = G.$('.chip[data-k="' + k + '"]', stage);
            if (chip) { g.appendChild(chip); g.classList.add('filled', 'reveal', 'locked'); chip.classList.add('ok'); revealed = true; }
          }
        });
        if (revealed) fb.textContent = t('story.showAnswer');
        if (G.$$('.gap.locked', stage).length === gs.length) complete();
      }, 1000);
    };
    function complete() {
      if (state.done) return; state.done = true;
      const p = G.pg(b.id, lv); p.story[part - 1] = 1; G.save();
      G.$$('.gap .chip', stage).forEach(c => { c.classList.add('ok'); c.setAttribute('data-peek', c.dataset.w); });
      const fb = G.$('#fb', stage); fb.textContent = G.$$('.gap.reveal', stage).length ? t('story.showAnswer') : t('story.allCorrect');
      const full = pieces.map(x => { const m = x.match(/^\[\[(\d+)\]\]$/); return m ? gaps[m[1] - 1].form : x; }).join('');
      const star = G.hasStar(b.id, lv);
      G.$('#nx', stage).innerHTML = '<button class="btn ghost" data-act="say" data-say="' + esc(full) + '">' + G.icon('speaker') + esc(t('story.readAgain')) + '</button>' +
        (part === 1 ? '<a class="btn primary" href="#/batch/' + b.id + '/story/2">' + esc(t('story.nextPart', { n: 2 })) + G.icon('arrow') + '</a>' : '<a class="btn primary" href="#/batch/' + b.id + '">' + esc(t('story.finish')) + G.icon('arrow') + '</a>') +
        '<button class="btn ghost" data-act="sAgain">' + G.icon('refresh') + esc(t('common.again')) + '</button>';
      if (star) { fb.textContent += ' ⭐ ' + t('story.starEarned'); }
      G.confetti(); G.touchStreak();
    }
    G.acts.sAgain = () => { G.render(); };
    G.redraw = () => { if (!state.done) { const keep = G.$$('.gap.locked', stage).length === 0; if (keep) draw(); } };
    draw();
  }

  /* ---------- GAMES: letter tiles, missing letters, spelling bee on the current batch ---------- */
  G.route(/^#\/play\/(build|missing|bee)\/(b\d+)\/([12])$/, function (act, id, part) {
    part = +part;
    return G.loadBatch(id).then(b => {
      const pg = playerPage(esc(t('games.title')) + ' · ' + esc(t('act.' + act)) + ' · ' + esc(t('common.part', { n: part })), '#/games', '#/games');
      pg.mount = root => {
        const stage = G.$('#stage', root), ws = partWords(b, part), lv = G.level();
        const done = (score, total) => {
          const p = G.pg(id, lv); p[act][part - 1] = score; G.save();
          finishCard(stage, { emoji: '🏆', title: t('pick.score', { n: score, m: total }), actions: [{ label: part === 1 ? t('common.part', { n: 2 }) : t('games.title'), href: part === 1 ? '#/play/' + act + '/' + id + '/2' : '#/games', primary: true }, { label: t('common.again'), act: 'gAgain' }] });
        };
        G.acts.gAgain = () => G.render();
        if (act === 'bee') beeRound(stage, ws, done); else buildRound(stage, ws, { mode: act, onDone: done });
      };
      return pg;
    });
  });
})(window.G = window.G || {});

/* Start the app: apply the saved theme, load the batch list, show the first screen. */
(function (G) {
  'use strict';
  G.applyTheme();
  G.boot().then(() => G.render()).catch(err => {
    console.error(err);
    document.getElementById('app').innerHTML = '<div class="welcome"><div class="glass card hero"><h3>' + G.esc(G.t('err.load')) + '</h3></div></div>';
  });
})(window.G);

</script>
</body>
</html>
